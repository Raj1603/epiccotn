<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vibrantGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D4D"/> <!-- Vibrant Red -->
      <stop offset="0.5" stop-color="#FF9E4D"/> <!-- Vibrant Orange -->
      <stop offset="1" stop-color="#FFCC4D"/> <!-- Vibrant Yellow/Gold -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Vibrant Brand Symbol/Icon -->
  <circle cx="20" cy="20" r="16" fill="url(#vibrantGradient)" />
  <path d="M14 20C14 16.6863 16.6863 14 20 14C23.3137 14 26 16.6863 26 20C26 23.3137 23.3137 26 20 26C16.6863 26 14 23.3137 14 20Z" stroke="white" stroke-width="2.5" />
  <path d="M20 10V14M20 26V30M10 20H14M26 20H30" stroke="white" stroke-width="2" stroke-linecap="round" />
  
  <!-- Sleek Typography -->
  <text x="48" y="27" fill="#111827" style="font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.1em;">OSYNDO</text>
  
  <!-- Subtle Tagline or Underline -->
  <rect x="48" y="32" width="112" height="2" fill="url(#vibrantGradient)" rx="1"/>
</svg>
